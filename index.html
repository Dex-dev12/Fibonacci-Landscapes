<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Self-hosted fonts. Previously four families across 20 faces loaded from
         fonts.googleapis.com, costing two extra origins (DNS + TLS + CSS, then
         DNS + TLS + woff2) before any text could paint, and ~1,950ms of
         render-blocking time.
         Only the latin subsets of the weights actually used are shipped, and
         three of them are variable fonts serving two weights from one file:
         5 files, 161KB total.
         font-display: optional gives each face a ~100ms window and then never
         swaps - a swap is what shifts layout, so this keeps CLS at zero. The
         metrics-matched fallbacks below carry size-adjust and ascent/descent
         overrides computed from the real font tables, so a page view that
         misses the window still lays out almost identically.
         Only Work Sans is preloaded. Preloading Bodoni as well put a 46KB
         high-priority request ahead of the render-blocking stylesheet, which
         held first paint to 3.4s; the display face falls back cleanly instead
         and loads from cache on later views. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/WorkSans-400.woff2" crossorigin />
    <style>
      @font-face{font-family:'Work Sans';font-style:normal;font-weight:400;font-display:optional;src:url('/fonts/WorkSans-400.woff2') format('woff2');}
      @font-face{font-family:'Bodoni Moda';font-style:normal;font-weight:600 700;font-display:optional;src:url('/fonts/BodoniModa-var.woff2') format('woff2');}
      @font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:400 500;font-display:optional;src:url('/fonts/CormorantGaramond-var.woff2') format('woff2');}
      @font-face{font-family:'Cormorant Garamond';font-style:italic;font-weight:400 500;font-display:optional;src:url('/fonts/CormorantGaramond-var-italic.woff2') format('woff2');}
      @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400;font-display:optional;src:url('/fonts/JetBrainsMono-400.woff2') format('woff2');}

      @font-face{font-family:'Work Sans Fallback';src:local('Arial'),local('Helvetica Neue'),local('Helvetica');size-adjust:110.4%;ascent-override:84.2%;descent-override:22.0%;line-gap-override:0%;}
      @font-face{font-family:'Bodoni Fallback';src:local('Times New Roman'),local('Times'),local('Georgia');size-adjust:132.9%;ascent-override:84.7%;descent-override:30.1%;line-gap-override:0%;}
      @font-face{font-family:'Cormorant Fallback';font-style:normal;src:local('Times New Roman'),local('Times'),local('Georgia');size-adjust:124.1%;ascent-override:74.4%;descent-override:23.1%;line-gap-override:0%;}
      @font-face{font-family:'Cormorant Fallback';font-style:italic;src:local('Times New Roman Italic'),local('Times Italic'),local('Times New Roman');size-adjust:115.4%;ascent-override:80.1%;descent-override:24.9%;line-gap-override:0%;}
      @font-face{font-family:'JetBrains Fallback';src:local('Courier New'),local('Courier');size-adjust:100%;ascent-override:102.0%;descent-override:30.0%;line-gap-override:0%;}
    </style>
    <!-- LCP element: discoverable before the JS bundle parses. -->
    <link
      rel="preload"
      as="image"
      href="/images/r/hero-1-1024.webp"
      imagesrcset="/images/r/hero-1-640.webp 640w, /images/r/hero-1-1024.webp 1024w, /images/r/hero-1-1200.webp 1200w, /images/r/hero-1-1440.webp 1440w"
      type="image/webp"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <meta name="description" content="Fibonacci Landscape Construction — pool surrounds, paving, concreting, retaining walls and garden landscaping across the Central Coast and Lake Macquarie, NSW." />
    <title>Fibonacci Landscape Construction — Pool Surround Specialist</title>
    <link rel="preconnect" href="https://links.versflows.com" />
    <link rel="dns-prefetch" href="https://links.versflows.com" />
    <link rel="preconnect" href="https://stcdn.leadconnectorhq.com" crossorigin />
    <link rel="dns-prefetch" href="https://backend.leadconnectorhq.com" />
    <!-- Google Analytics 4, loaded after the page has painted.
         gtag.js is ~166KB of third-party JavaScript. Loading it from <head>
         put it in the critical path: element render delay on the LCP headline
         measured 1,651-2,503ms while nothing else in the head could account
         for it. The same change on the Markwicks build took median mobile LCP
         from 2,900ms to 1,504ms.

         The dataLayer queue and the config call still run immediately, so the
         pageview keeps its real timestamp - gtag.js processes the queued calls
         once it arrives. Only the network fetch is deferred, so no data is
         lost, and a visitor who leaves before load fires is still counted. -->
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-GCB4XBXQNP');

      (function () {
        var loaded = false;
        function loadGtag() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-GCB4XBXQNP';
          document.head.appendChild(s);
        }
        function schedule() {
          if ('requestIdleCallback' in window) {
            window.requestIdleCallback(loadGtag, { timeout: 3000 });
          } else {
            setTimeout(loadGtag, 1200);
          }
        }
        if (document.readyState === 'complete') schedule();
        else window.addEventListener('load', schedule, { once: true });
        document.addEventListener('visibilitychange', function () {
          if (document.visibilityState === 'hidden') loadGtag();
        });
      })();
    </script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-GCB4XBXQNP');
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
